"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = """
if [ -f "$CONDUCTOR_ROOT_PATH/apps/server/.env" ] && [ ! -f apps/server/.env ]; then
  cp "$CONDUCTOR_ROOT_PATH/apps/server/.env" apps/server/.env
fi

# Prisma only needs a syntactically valid URL while generating its client.
# The real application still reads DATABASE_URL from apps/server/.env at runtime.
DATABASE_URL="${DATABASE_URL:-postgresql://localhost:5432/cantiara}" bun install
"""
archive = ":"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = '''
bun -e '
const basePort = Number(process.env.CONDUCTOR_PORT);
if (!Number.isInteger(basePort) || basePort < 1 || basePort > 65533) {
  console.error("CONDUCTOR_PORT must be an integer between 1 and 65533.");
  process.exit(2);
}

const serverPort = basePort;
const webPort = basePort + 1;
const docsPort = basePort + 2;
const portCheck = Bun.spawnSync(
  ["./scripts/check-dev-ports.sh", String(serverPort), String(webPort), String(docsPort)],
  { stdout: "inherit", stderr: "inherit" },
);
if (portCheck.exitCode !== 0) {
  process.exit(portCheck.exitCode);
}

const common = { ...process.env };
const children = [
  Bun.spawn(["bun", "run", "dev"], {
    cwd: "apps/server",
    env: {
      ...common,
      PORT: String(serverPort),
      BETTER_AUTH_URL: `http://localhost:${serverPort}`,
      CORS_ORIGIN: `http://localhost:${webPort}`,
    },
    stdin: "inherit",
    stdout: "inherit",
    stderr: "inherit",
  }),
  Bun.spawn(["bun", "run", "dev", "--", "--port", String(webPort), "--strictPort"], {
    cwd: "apps/web",
    env: { ...common, VITE_SERVER_URL: `http://localhost:${serverPort}` },
    stdin: "inherit",
    stdout: "inherit",
    stderr: "inherit",
  }),
  Bun.spawn(["bunx", "next", "dev", "--port", String(docsPort)], {
    cwd: "apps/fumadocs",
    env: common,
    stdin: "inherit",
    stdout: "inherit",
    stderr: "inherit",
  }),
];

let stopping = false;
const stop = (signal = "SIGTERM") => {
  if (stopping) return;
  stopping = true;
  for (const child of children) child.kill(signal);
};
for (const signal of ["SIGHUP", "SIGINT", "SIGTERM"]) {
  process.on(signal, () => stop(signal));
}

const first = await Promise.race(
  children.map(async (child) => ({ code: await child.exited })),
);
stop();
await Promise.allSettled(children.map((child) => child.exited));
process.exit(first.code);
'
'''
default = true
icon = "play"

[scripts.run.web]
available_in = [ "local" ]
command = '''
base_port="$CONDUCTOR_PORT"
web_port="$((base_port + 1))"
./scripts/check-dev-ports.sh "$web_port" &&
VITE_SERVER_URL="http://localhost:$base_port" bun --cwd apps/web run dev -- --port "$web_port" --strictPort
'''
icon = "globe"

[scripts.run.server]
available_in = [ "local" ]
command = '''
base_port="$CONDUCTOR_PORT"
web_port="$((base_port + 1))"
./scripts/check-dev-ports.sh "$base_port" &&
PORT="$base_port" BETTER_AUTH_URL="http://localhost:$base_port" CORS_ORIGIN="http://localhost:$web_port" bun --cwd apps/server run dev
'''
icon = "server"
