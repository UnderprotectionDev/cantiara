"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = """
if [ -f "$CONDUCTOR_ROOT_PATH/apps/server/.env" ] && [ ! -f apps/server/.env ]; then
  cp "$CONDUCTOR_ROOT_PATH/apps/server/.env" apps/server/.env
fi

# Prisma only needs a syntactically valid URL while generating its client.
# The real application still reads DATABASE_URL from apps/server/.env at runtime.
DATABASE_URL="${DATABASE_URL:-postgresql://localhost:5432/cantiara}" bun install
"""
archive = ":"
run_mode = "nonconcurrent"

[scripts.run.dev]
command = "./scripts/check-dev-ports.sh && bun run dev"
default = true
icon = "play"

[scripts.run.web]
command = "./scripts/check-dev-ports.sh 3001 && bun run dev:web"
icon = "globe"

[scripts.run.server]
command = "./scripts/check-dev-ports.sh 3000 && bun run dev:server"
icon = "server"
