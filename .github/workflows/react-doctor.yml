# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

# Advisory PR review only: the sticky summary and inline comments list issues
# the PR introduced relative to the merge base. No commit status or main-branch
# trend scan is published because nothing consumes them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Cancels any in-flight scan for the same PR the moment a new commit arrives.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 lets React Doctor find the merge base; a shallow checkout
      # falls back to reporting pre-existing issues in the changed files.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pinned so findings change only with an explicit upgrade.
      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
        with:
          blocking: none
          commit-status: false
          version: "0.9.18"
