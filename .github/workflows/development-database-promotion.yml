name: Development database promotion

on:
  workflow_run:
    workflows: [Integration tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canonical-neon-development
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: neon-development
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_SECURITY_API_KEY: ${{ secrets.NEON_SECURITY_API_KEY }}
      PROMOTION_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply canonical migrations and verify development bases
        run: bun run db:development:promote
