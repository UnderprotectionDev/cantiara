# Signed and notarized macOS package for a product candidate.
#
# Local `tauri build` without Apple credentials is an unsigned skeleton and is
# not product behavior. This workflow refuses to publish unless signing and
# notarization credentials are present and the desktop talks to the hosted
# Hono/Bun API.
#
# GitHub secrets:
#   APPLE_CERTIFICATE              base64-encoded Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD     password for that .p12
#   APPLE_SIGNING_IDENTITY         "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                       Apple ID email
#   APPLE_PASSWORD                 app-specific password
#   APPLE_TEAM_ID                  10-character Team ID
# Optional App Store Connect API alternative:
#   APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8
# Repository variable:
#   DESKTOP_SERVER_URL             hosted Hono/Bun origin, not localhost

name: macOS signed package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  client-shell-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test src/features/web-macos-client/macos-package.test.ts
        working-directory: apps/web

  publish-macos:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VITE_SERVER_URL: ${{ vars.DESKTOP_SERVER_URL }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="${RUNNER_TEMP}/apple-api-key.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi
      - name: Refuse an unsigned product candidate
        run: bun scripts/require-product-candidate.ts
        working-directory: apps/web
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/web
          tauriScript: bun run tauri
          args: --bundles app,dmg
