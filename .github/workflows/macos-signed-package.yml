# Signed and notarized macOS package for a product candidate.
#
# Local tauri.conf.json uses signingIdentity "-" (ad-hoc skeleton). That is not
# a product candidate. APPLE_SIGNING_IDENTITY in this job overrides it.
# This workflow refuses to publish unless signing and notarization credentials
# are present and the desktop talks to the hosted Hono/Bun API.
#
# GitHub secrets:
#   APPLE_CERTIFICATE              base64-encoded Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD     password for that .p12
#   APPLE_SIGNING_IDENTITY         "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                       Apple ID email
#   APPLE_PASSWORD                 app-specific password
#   APPLE_TEAM_ID                  10-character Team ID
#   TAURI_SIGNING_PRIVATE_KEY           minisign secret matching plugins.updater.pubkey
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  password for that secret (empty if none)
# Optional App Store Connect API alternative:
#   APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8
# Repository variable:
#   DESKTOP_SERVER_URL             hosted Hono/Bun origin, not localhost
#
# Previous GitHub Release assets stay downloadable for documented manual recovery.
# Do not delete the prior signed macOS installer when publishing a newer one.

name: macOS signed package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  client-shell-package:
    runs-on: ubuntu-latest
    env:
      # @cantiara/db postinstall runs `prisma generate`, which requires DATABASE_URL.
      # This job does not connect to Postgres.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test src/features/web-macos-client/macos-package.test.ts src/features/web-macos-client/desktop-updater.test.ts src/features/web-macos-client/desktop-api-window.test.ts src/features/web-macos-client/views/client-shell.test.ts
        working-directory: apps/web

  publish-macos:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      VITE_SERVER_URL: ${{ vars.DESKTOP_SERVER_URL }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="${RUNNER_TEMP}/apple-api-key.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi
      - name: Refuse an unsigned product candidate
        run: bun scripts/require-macos-product-candidate.ts
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/web
          tauriScript: bun run tauri
          args: --bundles app,dmg
