name: Code quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ultracite:
    name: Ultracite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check with Ultracite
        run: bun run check:ultracite
      - name: Check structure and stack conventions
        run: bun run check:conventions -- --base ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Test convention check
        run: bunx vitest run scripts/check-conventions.test.ts
