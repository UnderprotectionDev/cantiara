name: Integration tests

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The local Neon transport shim makes this an integration signal, not canonical
# product acceptance evidence under docs/tech-stack.md.
jobs:
  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cantiara
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cantiara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACCOUNT_ACCESS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara_migration_test
      BETTER_AUTH_SECRET: account-access-integration-secret-123456789
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara
      NEON_LOCAL: "true"
      SECURITY_EVENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara_security
      VITE_SERVER_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.13-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Vitest transforms
        uses: actions/cache@v4
        with:
          path: node_modules/.vitest-cache
          key: ${{ runner.os }}-${{ runner.arch }}-vitest-v1-database-${{ hashFiles('bun.lock', '**/vite.config.*', '**/vitest.config.*', '**/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vitest-v1-database-${{ hashFiles('bun.lock', '**/vite.config.*', '**/vitest.config.*', '**/tsconfig*.json') }}-
      - name: Prepare PostgreSQL boundaries
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE cantiara_security' \
            -c 'CREATE DATABASE cantiara_migration_test' \
            -c 'CREATE DATABASE cantiara_migration_test_security' \
            -c 'CREATE DATABASE cantiara_migration_test_fresh'
      - name: Validate migration sources and database readiness
        run: |
          set -euo pipefail
          bun scripts/neon-local-proxy.ts &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          bun run db:check
          bun run db:test -- --no-file-parallelism --fsModuleCache

  server-integration:
    name: Server integration (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cantiara
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cantiara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACCOUNT_ACCESS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara
      BETTER_AUTH_SECRET: account-access-integration-secret-123456789
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara
      NEON_LOCAL: "true"
      SECURITY_EVENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara_security
      VITE_SERVER_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.13-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Vitest transforms
        uses: actions/cache@v4
        with:
          path: node_modules/.vitest-cache
          key: ${{ runner.os }}-${{ runner.arch }}-vitest-v1-server-${{ matrix.shard }}-${{ hashFiles('bun.lock', '**/vite.config.*', '**/vitest.config.*', '**/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vitest-v1-server-${{ matrix.shard }}-${{ hashFiles('bun.lock', '**/vite.config.*', '**/vitest.config.*', '**/tsconfig*.json') }}-
      - name: Install server integration browsers
        run: bunx playwright install --with-deps chromium webkit
        working-directory: apps/server
      - name: Prepare PostgreSQL boundaries
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cantiara_security'
      - name: Run server integration tests
        run: |
          set -euo pipefail
          bun scripts/neon-local-proxy.ts &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          bun run --cwd packages/db db:migrate:deploy
          bun run --cwd packages/db db:security:migrate:deploy
          bun run --cwd apps/server test -- --no-file-parallelism --shard=${{ matrix.shard }}/2 --fsModuleCache

  unit-integration:
    name: Type checks and web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SERVER_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.13-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Vitest transforms
        uses: actions/cache@v4
        with:
          path: node_modules/.vitest-cache
          key: ${{ runner.os }}-${{ runner.arch }}-vitest-v1-unit-${{ hashFiles('bun.lock', '**/vite.config.*', '**/vitest.config.*', '**/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vitest-v1-unit-${{ hashFiles('bun.lock', '**/vite.config.*', '**/vitest.config.*', '**/tsconfig*.json') }}-
      - name: Validate integration scheduling
        run: bunx vitest run scripts/ci-workflow.test.ts --fsModuleCache
      - name: Cache Turbo tasks
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-v1-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-v1-${{ hashFiles('bun.lock', 'turbo.json') }}-
      - name: Run type checks
        run: bun run check-types
      - name: Run web unit tests
        run: bun run --cwd apps/web test -- --fsModuleCache

  # Preserve the existing required Core integration check while its suites run
  # independently. A skipped or cancelled suite must not turn this gate green.
  core-integration:
    name: Core integration
    needs:
      - database-integration
      - server-integration
      - unit-integration
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all core integration jobs to pass
        env:
          DATABASE_RESULT: ${{ needs.database-integration.result }}
          SERVER_RESULT: ${{ needs.server-integration.result }}
          UNIT_RESULT: ${{ needs.unit-integration.result }}
        run: |
          if [[ "$DATABASE_RESULT" != "success" || \
                "$SERVER_RESULT" != "success" || \
                "$UNIT_RESULT" != "success" ]]; then
            echo "Database integration: $DATABASE_RESULT"
            echo "Server integration: $SERVER_RESULT"
            echo "Type checks and web unit tests: $UNIT_RESULT"
            exit 1
          fi

  # Keep one worker per isolated database: requests within each shard share a
  # local client identity and rate-limit bucket. Run the reference-scale
  # measurement on its own runner so test work cannot distort its budget.
  browser-integration:
    name: Browser integration (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cantiara
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cantiara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACCOUNT_ACCESS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara
      BETTER_AUTH_SECRET: account-access-integration-secret-123456789
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara
      NEON_LOCAL: "true"
      SECURITY_EVENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara_security
      VITE_SERVER_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.13-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare PostgreSQL boundaries
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cantiara_security'
      - name: Install integration browsers
        run: bunx playwright install --with-deps chromium firefox
        working-directory: apps/web
      - name: Run browser integration tests
        run: |
          set -euo pipefail
          bun scripts/neon-local-proxy.ts &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          bun run --cwd packages/db db:migrate:deploy
          bun run --cwd packages/db db:security:migrate:deploy
          bun run test:e2e -- \
            --workers=1 \
            --reporter=list \
            --shard=${{ matrix.shard }}/6 \
            --grep-invert \
            "Web Capture|measures Command Palette visibility at the reference workspace scale"
      - name: Run browser extension integration test
        if: matrix.shard == 1
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" bun run --cwd apps/web test:e2e:extension

  command-palette-performance:
    name: Command Palette performance (${{ matrix.cache }}-cache)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cache: [hot, cold]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cantiara
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cantiara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACCOUNT_ACCESS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara
      BETTER_AUTH_SECRET: account-access-integration-secret-123456789
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara
      NEON_LOCAL: "true"
      SECURITY_EVENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cantiara_security
      VITE_SERVER_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.13-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare PostgreSQL boundaries
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE cantiara_security'
      - name: Install Chromium
        run: bunx playwright install --with-deps --only-shell chromium
        working-directory: apps/web
      - name: Measure Command Palette performance
        env:
          PLAYWRIGHT_LIST_PRINT_STEPS: "true"
        run: |
          set -euo pipefail
          bun scripts/neon-local-proxy.ts &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          bun run --cwd packages/db db:migrate:deploy
          bun run --cwd packages/db db:security:migrate:deploy
          bun run test:e2e -- \
            --workers=1 \
            --reporter=list \
            --grep \
            "measures Command Palette visibility at the reference workspace scale: ${{ matrix.cache }}-cache$"

  integration-gate:
    name: Integration gate
    needs:
      - core-integration
      - browser-integration
      - command-palette-performance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all integration jobs to pass
        env:
          CORE_RESULT: ${{ needs.core-integration.result }}
          BROWSER_RESULT: ${{ needs.browser-integration.result }}
          PERFORMANCE_RESULT: ${{ needs.command-palette-performance.result }}
        run: |
          if [[ "$CORE_RESULT" != "success" || \
                "$BROWSER_RESULT" != "success" || \
                "$PERFORMANCE_RESULT" != "success" ]]; then
            echo "Core integration: $CORE_RESULT"
            echo "Browser integration: $BROWSER_RESULT"
            echo "Command Palette performance: $PERFORMANCE_RESULT"
            exit 1
          fi
